[project]
name = "post-training"
version = "0.1.0"
description = "Low-level, reusable post-training research workflows."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "accelerate>=1.2.0,<2",
    "datasets>=3.1.0,<4",
    "datasketch>=1.6.5,<2",
    "deep-translator>=1.11.4,<2",
    "diskcache>=5.6.3,<6",
    "evaluate>=0.4.3,<0.5",
    "jsonlines>=4.0.0,<5",
    "litellm>=1.53.9,<2",
    "loguru>=0.7.3,<0.8",
    "math-verify>=0.7.0,<0.8",
    "peft>=0.14.0,<0.15",
    "python-dotenv>=1.0.1,<2",
    "sacrebleu>=2.5.1,<3",
    "tenacity>=9.0.0,<10",
    "torch>=2.6.0,<3",
    "transformers>=4.49.0,<5",
    "trl>=0.17.0,<0.18",
    "typer>=0.15.1,<0.16",
]

[project.optional-dependencies]
gpu = [
    "bitsandbytes>=0.45.2,<0.46; sys_platform == 'linux'",
    "deepspeed==0.15.4; sys_platform == 'linux'",
]
tracking = ["wandb>=0.19.7,<0.20"]
modal = ["modal>=1.2.3,<2"]
dev = [
    "ipykernel>=6.29.5,<7",
    "ipywidgets>=8.1.5,<9",
    "pre-commit>=4.1.0,<5",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["post_training"]

[tool.ruff]
extend-exclude = ["src/data/persona_generation/prompt_template.py"]
