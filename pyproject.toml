[project]
name = "post-training"
version = "0.1.0"
description = "Low-level, reusable post-training research workflows."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "accelerate==1.2.1",
    "datasets==3.2.0",
    "datasketch==1.6.5",
    "deep-translator==1.11.4",
    "diskcache==5.6.3",
    "evaluate==0.4.3",
    "jsonlines==4.0.0",
    "litellm==1.56.4",
    "loguru==0.7.3",
    "math-verify==0.7.0",
    "peft==0.14.0",
    "python-dotenv==1.0.1",
    "sacrebleu==2.5.1",
    "tenacity==9.0.0",
    "torch==2.6.0",
    "transformers==4.49.0",
    "trl==0.17.0",
    "typer==0.15.1",
]

[project.optional-dependencies]
gpu = [
    "bitsandbytes==0.45.5; sys_platform == 'linux'",
    "deepspeed==0.15.4; sys_platform == 'linux'",
]
tracking = ["wandb==0.19.11"]
modal = ["modal==1.5.4"]
dev = [
    "ipykernel==6.29.5",
    "ipywidgets==8.1.5",
    "pre-commit==4.1.0",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["post_training"]

[tool.ruff]
extend-exclude = ["src/data/persona_generation/prompt_template.py"]
